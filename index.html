<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS de Costos y Caja - Mini ERP</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal" x-data="app()">

    <!-- Header / Navbar -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">Control Negocio SaaS 🚀</h1>
            <span class="text-xs bg-indigo-500 px-3 py-1 rounded-full">Versión Demo MVP</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container mx-auto px-4 py-6 max-w-4xl">

        <!-- Navegación de pestañas -->
        <div class="flex border-b border-gray-300 mb-6">
            <button @click="tab = 'costos'" :class="tab === 'costos' ? 'border-indigo-600 text-indigo-600 font-bold' : 'border-transparent text-gray-500'" class="py-2 px-4 border-b-2 focus:outline-none transition">
                🍰 Costos y Recetas
            </button>
            <button @click="tab = 'caja'" :class="tab === 'caja' ? 'border-indigo-600 text-indigo-600 font-bold' : 'border-transparent text-gray-500'" class="py-2 px-4 border-b-2 focus:outline-none transition">
                💰 Cuadre de Caja
            </button>
        </div>

        <!-- MÓDULO 1: COSTOS Y RECETAS -->
        <div x-show="tab === 'costos'" class="space-y-6">
            <div class="bg-white p-6 rounded-lg shadow-sm">
                <h2 class="text-lg font-semibold text-gray-800 mb-4">Calculadora de Costos de Producción</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Nombre del Plato / Producto</label>
                        <input type="text" x-model="newRecipe.name" placeholder="Ej. Torta de Chocolate" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Costo Total de Ingredientes ($/S/.)</label>
                        <input type="number" x-model.number="newRecipe.cost" placeholder="0.00" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Margen de Ganancia Deseado (%)</label>
                        <input type="number" x-model.number="newRecipe.margin" placeholder="50" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                </div>
                <button @click="addRecipe" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 transition">Calcular y Guardar Receta</button>
            </div>

            <!-- Listado de Recetas -->
            <div class="bg-white p-6 rounded-lg shadow-sm">
                <h3 class="text-md font-semibold text-gray-800 mb-3">Tus Recetas Registradas</h3>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead>
                            <tr>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Producto</th>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Costo Base</th>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Precio Sugerido</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-200">
                            <template x-for="recipe in recipes" :key="recipe.name">
                                <tr>
                                    <td class="px-4 py-2 text-sm text-gray-800" x-text="recipe.name"></td>
                                    <td class="px-4 py-2 text-sm text-gray-600" x-text="recipe.cost.toFixed(2)"></td>
                                    <td class="px-4 py-2 text-sm font-bold text-green-600" x-text="(recipe.cost * (1 + recipe.margin / 100)).toFixed(2)"></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- MÓDULO 2: CUADRE DE CAJA -->
        <div x-show="tab === 'caja'" class="space-y-6">
            <div class="bg-white p-6 rounded-lg shadow-sm">
                <h2 class="text-lg font-semibold text-gray-800 mb-4">Cierre y Cuadre Diario de Caja</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Fondo Inicial en Caja</label>
                        <input type="number" x-model.number="caja.opening" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Ventas en Efectivo (Sistema)</label>
                        <input type="number" x-model.number="caja.cashSales" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Ventas Yape / Plin / Digital</label>
                        <input type="number" x-model.number="caja.digitalSales" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Efectivo Real Contado en Caja</label>
                        <input type="number" x-model.number="caja.realCash" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                </div>

                <!-- Resumen de Resultados -->
                <div class="bg-gray-50 p-4 rounded-md border border-gray-200 mt-4 space-y-2">
                    <p class="text-sm text-gray-600">Efectivo Teórico Esperado: <span class="font-bold text-gray-800" x-text="(caja.opening + caja.cashSales).toFixed(2)"></span></p>
                    <p class="text-sm text-gray-600">Diferencia (Sobrante / Faltante): 
                        <span class="font-bold" :class="(caja.realCash - (caja.opening + caja.cashSales)) >= 0 ? 'text-green-600' : 'text-red-600'" 
                              x-text="(caja.realCash - (caja.opening + caja.cashSales)).toFixed(2)">
                        </span>
                    </p>
                </div>
            </div>
        </div>

    </main>

    <!-- Script de Lógica con Alpine.js -->
    <script>
        function app() {
            return {
                tab: 'costos',
                newRecipe: { name: '', cost: '', margin: 40 },
                recipes: [
                    { name: 'Café Americano', cost: 2.50, margin: 60 },
                    { name: 'Hamburguesa Clásica', cost: 6.00, margin: 50 }
                ],
                caja: {
                    opening: 50.00,
                    cashSales: 200.00,
                    digitalSales: 150.00,
                    realCash: 250.00
                },
                addRecipe() {
                    if(this.newRecipe.name && this.newRecipe.cost) {
                        this.recipes.push({
                            name: this.newRecipe.name,
                            cost: parseFloat(this.newRecipe.cost),
                            margin: parseFloat(this.newRecipe.margin)
                        });
                        this.newRecipe.name = '';
                        this.newRecipe.cost = '';
                    }
                }
            }
        }
    </script>
</body>
</html>
